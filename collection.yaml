# The Physical AI Collection — data file. Licence: CC BY 4.0 (LICENSE).
# One entry per project. Every entry was opened and checked on the date in `verified`.
# Rules (README "Rules"): company-owned projects carry facts only (`reading: null`);
# a reading — becoming or returning, with a dated one-line reason — is given only to
# community, academic, foundation and public-research projects. No tickers, no company commentary.

readings:
  becoming: Extends what the physical body of intelligence can do — more compute, more power, more machines.
  returning: Removes a necessity — efficiency, measurement of waste, or a once-scarce input made common.

entries:
  # ── Compute ───────────────────────────────────────────────────────────────
