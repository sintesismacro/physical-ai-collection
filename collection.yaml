    layer: compute
    kind: repository
    url: https://github.com/The-OpenROAD-Project/OpenROAD
    owner: The OpenROAD Project, led by UC San Diego with university and industry partners
    owner_type: academic
    licence: BSD-3-Clause
    does: Automates digital chip layout from register-transfer-level design to GDSII.
    reading: returning
    reason: Removes the need for a licensed design flow to take a chip to layout.
    verified: 2026-10-23
    basis: project documentation (repository page not reachable from the checker)
